name: Scale Set Smoke Test

on:
  workflow_dispatch:

jobs:
  hello:
    name: Hello from runner scale set
    runs-on: codebuild-ea-foundation-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Show runner spec
        run: |
          cat /tmp/codebuild/readonly/buildspec.yml
          echo "Runner OS: $RUNNER_OS"
          echo "Runner arch: $RUNNER_ARCH"
          echo "Runner name: $RUNNER_NAME"
          uname -a
